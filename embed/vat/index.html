<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="stylesheet" href="/assets/style.css?v=c7e4eef4"><style>html,body{background:transparent!important}body{margin:0;padding:8px}#page-net,.fad{display:none!important}
.gen{grid-template-columns:1fr!important}.emb-by{margin:10px 2px 0;font:600 13px/1.4 Inter,system-ui,sans-serif;color:#46557a}.emb-by a{color:#ff6b35;text-decoration:none}</style></head>
<body class="embed">
  <div class="gen">
    <form class="panel" data-calc="vat" autocomplete="off" novalidate>
<label>What do you want to do?</label>
<div class="seg" role="radiogroup"><label><input type="radio" name="mode" value="add" checked><span>Add VAT</span></label><label><input type="radio" name="mode" value="remove"><span>Remove VAT</span></label></div>

<input type="text" id="amount" name="amount" inputmode="decimal" placeholder="e.g. 100">
<label>VAT rate</label>
<div class="seg" role="radiogroup"><label><input type="radio" name="rate" value="20" checked><span>20% standard</span></label><label><input type="radio" name="rate" value="5"><span>5% reduced</span></label><label><input type="radio" name="rate" value="0"><span>0% zero</span></label><label><input type="radio" name="rate" value="custom"><span>Other</span></label></div>
<div data-show-when="rate=custom"><label for="custom">Custom rate (%)</label><input type="text" id="custom" name="custom" inputmode="decimal" placeholder="e.g. 12.5"></div></form>
    <div class="panel preview"><div id="calc-out" class="calc-out" aria-live="polite"></div>
      <p class="note">Calculated on your device. Figures are rounded to the nearest penny.</p></div>
  </div>
<p class="emb-by">Free UK VAT calculator by <a href="https://etoolbox.co.uk/vat-calculator/" target="_blank" rel="noopener">etoolbox.co.uk</a></p>
